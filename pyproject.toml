[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-core"
version = "0.1.0"
description = "Shared utilities for Court Vision services: NBA calendar, season keys, crypto, resilience, logging, scoring vocabulary, fantasy-points formula"
requires-python = ">=3.12"
dependencies = [
    # Floors, not pins: the consumers' requirements.txt pin exact versions.
    # cryptography is the one with a hard cross-service constraint — both
    # services decrypt the same usr.provider_connections rows, so their pins
    # must stay in lockstep with each other (46.0.3 at time of writing).
    "cryptography>=46.0.3",
    "structlog>=24.4.0",
    "sentry-sdk>=2.68.0",
    "tenacity>=9.0.0",
    "circuitbreaker>=2.0.0",
    "requests>=2.32.0",
    "starlette>=0.49.0",
    "pytz>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.5"]

[tool.setuptools.packages.find]
include = ["cv_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast isolated tests"]
